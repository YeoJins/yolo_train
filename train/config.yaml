# Training Configuration
model: /home/yeojin/yolo_train/ckpt/yolov8n_ep600_p70.pt
data: ./dataset.yaml
device: cuda  # cuda or cpu

# Training Parameters
imgsz: 480
epochs: 100
batch: 256
patience: 70
workers: 8
optimizer: AdamW

# Save Configuration
# Note: project 경로는 train.py에서 자동으로 yolo_train/runs/train으로 설정됩니다
# name도 날짜_모델_에폭_hsv값으로 자동 생성되므로 아래 값은 무시됩니다
project: ./runs/train  # 이 값은 무시됨 (자동 설정)
name: model_name  # 이 값은 무시됨 (자동 생성)
plots: true

# Data Augmentation Parameters
# HSV-Hue augmentation (fraction)
hsv_h: 0.0
# HSV-Saturation augmentation (fraction)
hsv_s: 0.25
# HSV-Value augmentation (fraction)
hsv_v: 0.3

# ========== Augmentation 참고 ==========
# HSV augmentation (±대칭 범위):
#   hsv_v: 0.3 → 0.7~1.3배 (±30%)
#   hsv_v: 0.5 → 0.5~1.5배 (±50%)
# =======================================
# Rotation (+/- deg)
degrees: 0.0
# Translation (+/- fraction)
translate: 0.1
# Scaling (+/- gain)
scale: 0.5
# Shear (+/- deg)
shear: 0.0
# Perspective (+/- fraction), range 0-0.001
perspective: 0.0
# Flip up-down (probability)
flipud: 0.0
# Flip left-right (probability)
fliplr: 0.5
# Mosaic (probability)
mosaic: 1.0
# MixUp (probability)
mixup: 0.1
# Copy-paste (probability)
copy_paste: 0.0
# Dropout (probability)
dropout: 0.2

# Advanced Training Parameters (optional)
# lr0: 0.01  # initial learning rate
# lrf: 0.01  # final learning rate factor
# momentum: 0.937
# weight_decay: 0.0005
# warmup_epochs: 3.0
# warmup_momentum: 0.8
# warmup_bias_lr: 0.1
# box: 7.5  # box loss gain
# cls: 0.5  # cls loss gain
# dfl: 1.5  # dfl loss gain

