# Training Configuration
model: yolov8n.pt
data: ./dataset.yaml
device: cuda  # cuda or cpu

# Training Parameters
imgsz: 480
epochs: 100
batch: 256
patience: 70
workers: 8
optimizer: AdamW

# Save Configuration
project: ./runs/train
name: model_name
plots: true

# Data Augmentation Parameters
# HSV-Hue augmentation (fraction)
hsv_h: 0.015
# HSV-Saturation augmentation (fraction)
hsv_s: 0.7
# HSV-Value augmentation (fraction)
hsv_v: 0.4
# Rotation (+/- deg)
degrees: 0.0
# Translation (+/- fraction)
translate: 0.1
# Scaling (+/- gain)
scale: 0.5
# Shear (+/- deg)
shear: 0.0
# Perspective (+/- fraction), range 0-0.001
perspective: 0.0
# Flip up-down (probability)
flipud: 0.0
# Flip left-right (probability)
fliplr: 0.5
# Mosaic (probability)
mosaic: 1.0
# MixUp (probability)
mixup: 0.0
# Copy-paste (probability)
copy_paste: 0.0

# Advanced Training Parameters (optional)
# lr0: 0.01  # initial learning rate
# lrf: 0.01  # final learning rate factor
# momentum: 0.937
# weight_decay: 0.0005
# warmup_epochs: 3.0
# warmup_momentum: 0.8
# warmup_bias_lr: 0.1
# box: 7.5  # box loss gain
# cls: 0.5  # cls loss gain
# dfl: 1.5  # dfl loss gain

